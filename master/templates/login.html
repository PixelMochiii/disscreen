<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ScreenManager · Connexion</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800;900&family=Fira+Code:wght@500&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after { box-sizing:border-box; margin:0; padding:0; }
  :root{
    --bg:#050813; --surface:rgba(255,255,255,.04); --surface-2:rgba(255,255,255,.06);
    --border:rgba(255,255,255,.08); --border-2:rgba(255,255,255,.12);
    --fg:#e6edf3; --muted:#8b95a8;
    --kal-teal:#1be1bd; --kal-blue:#4e79e9;
    --shadow:0 30px 80px -20px rgba(0,0,0,.5);
  }
  html, body {
    height:100%; background:var(--bg); color:var(--fg);
    font-family:'DM Sans', system-ui, sans-serif;
    -webkit-font-smoothing:antialiased; overflow:hidden;
  }
  body { display:flex; align-items:center; justify-content:center; padding:1.5rem; }

  /* Aurora background */
  body::before, body::after {
    content:''; position:fixed; border-radius:50%;
    filter:blur(120px); opacity:.55; pointer-events:none; z-index:0;
    animation:drift 20s ease-in-out infinite alternate;
  }
  body::before {
    width:60vmax; height:60vmax; top:-25vmax; left:-20vmax;
    background:radial-gradient(circle, var(--kal-blue) 0%, transparent 70%);
  }
  body::after {
    width:55vmax; height:55vmax; bottom:-25vmax; right:-15vmax;
    background:radial-gradient(circle, var(--kal-teal) 0%, transparent 70%);
    animation-delay:-10s;
  }
  @keyframes drift {
    0%   { transform:translate(0,0) scale(1); }
    50%  { transform:translate(8%,-6%) scale(1.15); }
    100% { transform:translate(-6%,8%) scale(.95); }
  }
  /* Subtle grid */
  .grid-bg {
    position:fixed; inset:0; pointer-events:none; z-index:0;
    background-image:
      linear-gradient(rgba(255,255,255,.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,.03) 1px, transparent 1px);
    background-size:48px 48px;
    -webkit-mask-image:radial-gradient(ellipse at center, black 30%, transparent 80%);
    mask-image:radial-gradient(ellipse at center, black 30%, transparent 80%);
  }

  .card {
    position:relative; z-index:1;
    width:100%; max-width:440px; padding:3rem 2.5rem;
    background:var(--surface); backdrop-filter:blur(24px);
    -webkit-backdrop-filter:blur(24px);
    border:1px solid var(--border-2);
    border-radius:32px;
    box-shadow:var(--shadow), 0 0 0 1px rgba(255,255,255,.04) inset;
    animation:rise .8s cubic-bezier(.16,1,.3,1);
  }
  @keyframes rise {
    from { opacity:0; transform:translateY(24px) scale(.98); }
    to   { opacity:1; transform:translateY(0) scale(1); }
  }

  .head { text-align:center; margin-bottom:2.5rem; }
  .scene { width:160px; height:115px; margin:0 auto 1.5rem; perspective:1000px; }
  .monitor {
    width:100%; height:100%; position:relative; transform-style:preserve-3d;
    animation:float3d 8s ease-in-out infinite;
  }
  .monitor-front {
    position:absolute; inset:0; background:#0a0e1a;
    border:3px solid #1f2937; border-radius:12px; overflow:hidden;
    display:flex; align-items:center; justify-content:center;
    box-shadow:
      inset 0 0 30px rgba(78,121,233,.4),
      0 25px 60px -15px rgba(78,121,233,.5),
      0 0 40px rgba(27,225,189,.25);
  }
  .monitor-front img {
    width:62%; height:auto; position:relative; z-index:2;
    filter:drop-shadow(0 0 10px rgba(78,121,233,.6));
    animation:pulseLogo 4s ease-in-out infinite;
  }
  .monitor-front::after {
    content:''; position:absolute; left:0; right:0; height:2px;
    background:linear-gradient(90deg, transparent, rgba(27,225,189,.7), transparent);
    box-shadow:0 0 18px rgba(27,225,189,.6);
    animation:scan 3s linear infinite;
  }
  .monitor-base {
    position:absolute; bottom:-22px; left:50%;
    width:54px; height:18px; background:#1f2937; border-radius:4px;
    transform:translateX(-50%) translateZ(-20px);
  }
  @keyframes float3d {
    0%,100% { transform:rotateY(-22deg) rotateX(15deg) translateY(0); }
    50%     { transform:rotateY(22deg) rotateX(-5deg) translateY(-12px); }
  }
  @keyframes pulseLogo { 0%,100%{transform:scale(1);opacity:.85} 50%{transform:scale(1.08);opacity:1} }
  @keyframes scan { 0%{top:-2px} 100%{top:120%} }

  .brand-tag {
    display:inline-flex; align-items:center; gap:.75rem;
    font-size:.65rem; font-weight:800; letter-spacing:.4em;
    color:var(--muted); text-transform:uppercase;
    margin-bottom:1rem;
  }
  .brand-tag::before, .brand-tag::after {
    content:''; width:24px; height:1px;
    background:linear-gradient(90deg, transparent, var(--kal-blue));
  }
  .brand-tag::after { background:linear-gradient(90deg, var(--kal-blue), transparent); }

  h1 {
    font-size:2rem; font-weight:900; line-height:1; letter-spacing:-.03em;
    background:linear-gradient(180deg, #fff 0%, rgba(255,255,255,.55) 100%);
    -webkit-background-clip:text; background-clip:text; color:transparent;
  }
  .subtitle { color:var(--muted); font-size:.85rem; margin-top:.6rem; font-weight:500; }

  .form { display:flex; flex-direction:column; gap:1.1rem; }
  label {
    display:block; font-size:.65rem; font-weight:700; letter-spacing:.2em;
    text-transform:uppercase; color:var(--muted); margin-bottom:.5rem;
  }
  .input {
    width:100%; padding:1rem 1.2rem; border-radius:14px;
    background:rgba(255,255,255,.03); color:var(--fg);
    border:1px solid var(--border); outline:none;
    font:600 .9rem 'DM Sans', sans-serif;
    transition:all .25s ease;
  }
  .input::placeholder { color:rgba(139,149,168,.5); font-weight:500; }
  .input:focus {
    background:rgba(255,255,255,.05);
    border-color:rgba(78,121,233,.5);
    box-shadow:0 0 0 4px rgba(78,121,233,.1), 0 0 30px -5px rgba(27,225,189,.2);
  }

  .error {
    display:flex; align-items:center; gap:.7rem;
    padding:.9rem 1.1rem; border-radius:12px;
    background:rgba(239,68,68,.08); border:1px solid rgba(239,68,68,.25);
    color:#fca5a5; font-size:.8rem; font-weight:600;
    animation:shake .4s cubic-bezier(.36,.07,.19,.97);
  }
  @keyframes shake {
    10%,90% { transform:translateX(-2px); }
    20%,80% { transform:translateX(3px); }
    30%,50%,70% { transform:translateX(-5px); }
    40%,60% { transform:translateX(5px); }
  }

  .btn {
    width:100%; margin-top:.5rem; padding:1.1rem 1.5rem; border-radius:14px;
    border:none; cursor:pointer; position:relative; overflow:hidden;
    background:linear-gradient(135deg, var(--kal-teal) 0%, var(--kal-blue) 100%);
    color:#0a0e1a; font:800 .8rem 'DM Sans', sans-serif;
    letter-spacing:.15em; text-transform:uppercase;
    transition:transform .2s ease, box-shadow .3s ease;
    box-shadow:0 10px 30px -10px rgba(78,121,233,.5);
  }
  .btn:hover {
    transform:translateY(-2px);
    box-shadow:0 20px 40px -10px rgba(78,121,233,.7), 0 0 40px rgba(27,225,189,.3);
  }
  .btn:active { transform:translateY(0); }
  .btn::before {
    content:''; position:absolute; inset:0;
    background:linear-gradient(90deg, transparent, rgba(255,255,255,.4), transparent);
    transform:translateX(-100%);
    transition:transform .6s ease;
  }
  .btn:hover::before { transform:translateX(100%); }
  .btn span { display:inline-flex; align-items:center; gap:.7rem; position:relative; z-index:1; }
  .btn svg { width:16px; height:16px; }

  .check-row {
    display:flex; align-items:center; gap:.7rem; margin-top:.3rem;
    font-size:.75rem; font-weight:600; color:var(--muted); cursor:pointer;
    user-select:none;
  }
  .check-row input { display:none; }
  .check-row .box {
    width:18px; height:18px; border-radius:5px;
    background:rgba(255,255,255,.04); border:1px solid var(--border-2);
    display:flex; align-items:center; justify-content:center;
    transition:all .2s ease;
  }
  .check-row .box svg { width:12px; height:12px; opacity:0; transform:scale(.5); transition:all .2s ease; color:#0a0e1a; }
  .check-row input:checked + .box { background:var(--kal-teal); border-color:var(--kal-teal); }
  .check-row input:checked + .box svg { opacity:1; transform:scale(1); }

  .footer {
    margin-top:2rem; padding-top:1.5rem; border-top:1px solid var(--border);
    text-align:center; font-size:.7rem; color:var(--muted); font-weight:500;
    line-height:1.7;
  }
  .footer a {
    color:var(--kal-teal); text-decoration:none; font-weight:700;
    background:linear-gradient(135deg, var(--kal-teal), var(--kal-blue));
    -webkit-background-clip:text; background-clip:text; color:transparent;
  }
  .footer a:hover { opacity:.8; }

  @media (prefers-reduced-motion: reduce) {
    body::before, body::after, .orb, .orb::before { animation:none; }
  }
</style>
</head>
<body>
  <div class="grid-bg"></div>
  <div class="card">
    <div class="head">
      <div class="scene">
        <div class="monitor">
          <div class="monitor-front">
            <img src="/static/logo.png" alt="YOUR_COMPANY" onerror="this.style.display='none'">
          </div>
          <div class="monitor-base"></div>
        </div>
      </div>
      <div class="brand-tag">SCREEN MANAGER</div>
      <h1>Bienvenue</h1>
      <div class="subtitle">Connectez-vous pour piloter la flotte d'écrans</div>
    </div>

    {% if error %}
    <div class="error">
      <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
      <span>{{ error }}</span>
    </div>
    {% endif %}

    <form method="POST" class="form" id="loginForm" autocomplete="on">
      <div>
        <label for="username">Identifiant</label>
        <input id="username" name="username" type="text" required autocomplete="username"
               class="input" placeholder="prenom.nom">
      </div>
      <div>
        <label for="password">Mot de passe</label>
        <input id="password" name="password" type="password" required autocomplete="current-password"
               class="input" placeholder="••••••••••">
      </div>

      <label class="check-row">
        <input type="checkbox" id="remember">
        <span class="box"><svg fill="none" stroke="currentColor" stroke-width="3" viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg></span>
        <span>Se souvenir de mon identifiant</span>
      </label>

      <button type="submit" class="btn">
        <span>
          Se connecter
          <svg fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>
        </span>
      </button>
    </form>

    <div class="footer">
      Accès restreint YOUR_COMPANY<br>
      Pour assistance : <a href="https://help.YOUR_COMPANY.net" target="_blank" rel="noopener">help.YOUR_COMPANY.net</a>
    </div>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const saved = localStorage.getItem('YOUR_COMPANY_user');
      if (saved) {
        document.getElementById('username').value = saved;
        document.getElementById('remember').checked = true;
      }
      document.getElementById('loginForm').addEventListener('submit', () => {
        const u = document.getElementById('username').value;
        if (document.getElementById('remember').checked) localStorage.setItem('YOUR_COMPANY_user', u);
        else localStorage.removeItem('YOUR_COMPANY_user');
      });
    });
  </script>
</body>
</html>
